{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Student Management System{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #1f2937;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .page-container {
            min-height: 100vh;
        }

        .main-content {
            width: 100%;
            min-height: 100vh;
        }

        .content-wrapper {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        @media (max-width: 768px) {
            .content-wrapper {
                padding: 16px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="page-container">

    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>

</div>

{% block extra_js %}{% endblock %}

</body>
</html>
